name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run langium:generate
      - run: npm run build
      - run: npm test --workspace packages/language
      - run: npm run package --workspace packages/extension
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/extension/*.vsix
